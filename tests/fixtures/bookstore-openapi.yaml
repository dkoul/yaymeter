openapi: 3.0.3
info:
  title: Bookstore API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8765
paths:
  /books:
    get:
      operationId: listBooks
      summary: List books
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      operationId: createBook
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Bad request
  /books/{bookId}:
    get:
      operationId: getBook
      summary: Get book by id
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Not found
components:
  schemas:
    Book:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
    BookInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
