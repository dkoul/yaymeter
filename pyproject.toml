[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaymeter"
version = "0.1.0"
description = "Yaymeter: OpenAPI-driven API functional and performance testing with JMeter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Deepak Koul" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "openapi-spec-validator>=0.7",
    "referencing>=0.35",
    "click>=8.1",
    "certifi>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
mcp = [
    "mcp>=1.6",
]

[project.scripts]
yaymeter = "api_test_agent.cli:main"
api-test-agent = "api_test_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests (may require JMeter)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
